services:
  # 1. Torrent Download Client (Host networking for direct peer discovery and UPnP)
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Sofia
      - WEBUI_PORT=8080
    volumes:
      - /home/neuromancer/plex/plex-torrents/config/qbittorrent:/config
      - /home/neuromancer/plex/torrents:/downloads
    restart: unless-stopped

  # 2. Torrent Indexer / Tracker Manager
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Sofia
    volumes:
      - /home/neuromancer/plex/plex-torrents/config/prowlarr:/config
    restart: unless-stopped

  # 3. Movies Manager
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Sofia
    volumes:
      - /home/neuromancer/plex/plex-torrents/config/radarr:/config
      - /home/neuromancer/plex:/data
      - /home/neuromancer/plex/torrents:/downloads
    restart: unless-stopped

  # 4. TV Shows Manager
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Sofia
    volumes:
      - /home/neuromancer/plex/plex-torrents/config/sonarr:/config
      - /home/neuromancer/plex:/data
      - /home/neuromancer/plex/torrents:/downloads
    restart: unless-stopped

  # 5. Subtitles Manager
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Sofia
    volumes:
      - /home/neuromancer/plex/plex-torrents/config/bazarr:/config
      - /home/neuromancer/plex:/data
    restart: unless-stopped
